{% extends "dashboard/layout/base.html" %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}

    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-semibold text-gray-900">{{ page_title }}</h1>
        <div class="flex gap-3">
            <a href="{% url 'lookups:color_list' %}" class="px-6 py-3 rounded-2xl border border-gray-200 text-gray-600 font-medium">Cancel</a>
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-2xl font-medium">Save</button>
        </div>
    </div>

    <div class="bg-white rounded-3xl shadow-sm p-6 max-w-md">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            {{ form.name }}
            {{ form.name.errors }}
        </div>
    </div>
</form>
{% endblock %}
